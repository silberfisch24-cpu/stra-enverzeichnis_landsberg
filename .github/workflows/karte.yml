name: Karte bauen
on:
  workflow_dispatch:
  push:
    paths: ["daten/*.pdf", "daten/namensanpassungen.csv", "skripte/**"]
permissions:
  contents: write
concurrency:
  group: karte
  cancel-in-progress: false
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pdfplumber pytest
      - run: python skripte/01_extrahieren.py
      - run: python skripte/02_osm_holen.py
      - run: python skripte/03_karte_bauen.py
      - run: python -m pytest -q
      - name: Ergebnis committen
        run: |
          git config user.name "karte-bot"; git config user.email "karte-bot@users.noreply.github.com"
          git add daten docs
          if ! git diff --cached --quiet; then
            git commit -m "Karte neu gebaut"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi
