<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straßenverzeichnis Landsberg – Zuständigkeiten</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#k{height:100%;margin:0}
.box{background:#fff;padding:8px 10px;border-radius:6px;font:13px/1.5 system-ui;box-shadow:0 1px 4px #0005}
.box i{display:inline-block;width:22px;height:4px;margin-right:6px;vertical-align:middle}
.box label{display:block;cursor:pointer}.box select{width:100%;margin:4px 0;font:13px system-ui}
#ctl{width:310px}
#pl{max-height:200px;overflow:auto;border:1px solid #ddd;border-radius:4px;margin:4px 0}
#pl .og{font-weight:600;font-size:12px;color:#555;padding:3px 6px 0}
#pl .pf{display:flex;align-items:baseline;gap:6px;padding:3px 6px;cursor:pointer}
#pl .pf:hover{background:#f0f0f0}#pl .pf.sel{background:#fff3b0}
#pl .n{flex:1;min-width:0}#pl .n small{display:block;color:#666;font-size:11.5px;line-height:1.25}
#pl .tag{flex:none;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid #b38f00;color:#7a6200;white-space:nowrap}
#pl .tag.k{border-color:#888;color:#555;border-style:dashed}
#pi .t{font-weight:600}#pi .s{color:#666;font-size:12px}#pi p{margin:4px 0}#pi small{color:#555}
#s{position:absolute;z-index:1000;top:10px;left:50px;padding:6px;font:14px system-ui;width:200px}
</style></head>
<body><input id="s" placeholder="Straße suchen …" list="l"><datalist id="l"></datalist><div id="k"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Farben: Träger der Baulast bzw. der tatsächlich Zuständige; "Anlieger" magenta und gestrichelt
const BAU={'Stadt':'#1f77d4','Kreis':'#f08a00','Privat':'#d62728','Land':'#2ca02c','gemischt (Text beachten)':'#8e44ad','Stadt Halle':'#795548','Baulast nicht angegeben':'#c5cae9'};
const GRAU='#9e9e9e',ANL='#d81b9a',GELB='#ffe34d';
const TRAEGER=[['#1f77d4','Stadt'],['#f08a00','Kreis'],['#d62728','Privat'],['#2ca02c','Land'],['#8e44ad','gemischt'],['#795548','Stadt Halle'],['#c5cae9','Baulast nicht angegeben']];
const ANSICHTEN={
 baulast:{t:'Baulast (wer unterhält die Straße)',leg:TRAEGER,farbe:p=>BAU[p.baulast]},
 reinigung:{t:'Straßenreinigung Fahrbahn: wer kehrt',leg:[[ANL,'Anlieger (gestrichelt)'],...TRAEGER],
  farbe:p=>p.reinigung==='A'?ANL:p.reinigung==='B'?BAU[p.baulast]:null},
 winter:{t:'Winterdienst Fahrbahn: wer räumt',leg:[[ANL,'Anlieger (gestrichelt)'],...TRAEGER],
  farbe:p=>p.winterdienst==='A'?ANL:p.winterdienst==='B'?BAU[p.baulast]:null}
};
let ansicht='baulast',zeigeGrau=true,ort='',alle=false,wahl=null,probleme=[];
const wer=(c,b)=>c==='A'||c==='Anlieger'?'Anlieger':(b==='gemischt (Text beachten)'?'Baulastträger (gemischt)':b);

const m=L.map('k').setView([51.45,12.2],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(m);
m.createPane('band');m.getPane('band').style.zIndex=380;m.getPane('band').style.pointerEvents='none';
const band=L.layerGroup().addTo(m),ebenen={};let g;

function stil(f){const p=f.properties,c=ANSICHTEN[ansicht].farbe(p);
 const aus=(ort&&p.ortsteil!==ort)||(!c&&!zeigeGrau);
 return {color:c||GRAU,weight:c?4:2,opacity:aus?0:(c?0.9:0.5),interactive:!aus,dashArray:c===ANL?'9 7':null,fillColor:c||GRAU,fillOpacity:aus?0:0.4};}
function popup(p){
 if(p.baulast==='nicht im Verzeichnis')return `<b>${p.name}</b><br>${p.ortsteil}<br><em>nicht im Straßenverzeichnis</em>`;
 return `<b>${p.name}</b>${p.ref?' ('+p.ref+')':''}<br>${p.ortsteil}<br>Baulast: ${p.baulast}<br>Reinigung Fahrbahn: ${wer(p.reinigung,p.baulast)}<br>Winterdienst Fahrbahn: ${wer(p.winterdienst,p.baulast)}<br>Gehweg: ${wer(p.gehweg,p.baulast)}`+
  (p.art?`<br>Straßenart: ${p.art}`:'')+(p.hinweis?`<br><em>${p.hinweis}</em>`:'')+(p.pruefen?'<br><em>Zuordnung unsicher</em>':'');}

fetch('strassen.geojson').then(r=>r.json()).then(d=>{
 g=L.geoJSON(d,{style:stil,onEachFeature:(f,l)=>{l.bindPopup(popup(f.properties));(ebenen[f.properties.name]=ebenen[f.properties.name]||[]).push(l);}}).addTo(m);
 m.fitBounds(g.getBounds());
 document.getElementById('l').innerHTML=Object.keys(ebenen).sort().map(n=>`<option>${n}`).join('');
 const orte=[...new Set(d.features.map(f=>f.properties.ortsteil))].sort();
 box.querySelector('#o').innerHTML='<option value="">alle Ortsteile</option>'+orte.map(o=>`<option>${o}`).join('');
});
document.getElementById('s').onchange=e=>{const a=ebenen[e.target.value];if(a){m.fitBounds(L.featureGroup(a).getBounds().pad(.3));a[0].openPopup();}};

// Bedienfeld: Ansicht, Ortsteil, Problemfälle
const ctl=L.control({position:'topright'});let box;
ctl.onAdd=()=>{box=L.DomUtil.create('div','box');box.id='ctl';L.DomEvent.disableClickPropagation(box);L.DomEvent.disableScrollPropagation(box);
 box.innerHTML=`<b>Ansicht</b>
 <select id="a">${Object.entries(ANSICHTEN).map(([k,v])=>`<option value="${k}">${v.t}`).join('')}</select>
 <select id="o"><option value="">alle Ortsteile</option></select>
 <label><input type="checkbox" id="gr" checked> Straßen ohne Verzeichniseintrag (grau)</label>
 <hr style="margin:6px 0"><b>Problemfälle <span id="pn"></span></b>
 <label><input type="checkbox" id="pa"> alle Problemfälle markieren</label>
 <div id="pl"></div><div id="pi"></div>`;
 box.querySelector('#a').onchange=e=>{ansicht=e.target.value;g&&g.setStyle(stil);legende();};
 box.querySelector('#o').onchange=e=>{ort=e.target.value;g&&g.setStyle(stil);liste();
  if(ort&&g){const b=L.featureGroup(g.getLayers().filter(l=>l.feature.properties.ortsteil===ort)).getBounds();if(b.isValid())m.fitBounds(b.pad(.1));}};
 box.querySelector('#gr').onchange=e=>{zeigeGrau=e.target.checked;g&&g.setStyle(stil);};
 box.querySelector('#pa').onchange=e=>{alle=e.target.checked;zeige(false);};
 box.querySelector('#pl').onclick=e=>{const r=e.target.closest('.pf');if(!r)return;const id=+r.dataset.id;wahl=wahl===id?null:id;liste();zeige(true);};
 return box;};
ctl.addTo(m);

// Problemfälle: nur Unsicheres und Nicht-Verortbares; alles andere ist einfach korrekt gefärbt
fetch('probleme.json').then(r=>r.json()).then(p=>{probleme=p;liste();});
function liste(){const z=probleme.filter(x=>!ort||x.ortsteil===ort);
 if(wahl!==null&&!z.some(x=>x.id===wahl))wahl=null;
 box.querySelector('#pn').textContent=`(${z.length})`;
 let h='',last='';
 z.forEach(x=>{if(!ort&&x.ortsteil!==last){last=x.ortsteil;h+=`<div class="og">${last}</div>`;}
  h+=`<div class="pf${x.id===wahl?' sel':''}" data-id="${x.id}"><span class="n">${x.strasse}${x.zusatz?`<small>${x.zusatz}</small>`:''}</span><span class="tag${x.art==='keine'?' k':''}">${{keine:'nicht verortbar',luecke:'Baulast fehlt'}[x.art]||'unsicher'}</span></div>`;});
 box.querySelector('#pl').innerHTML=h||'<div class="og">keine</div>';
 zeige(false);}
function zeige(zoom){band.clearLayers();const info=box.querySelector('#pi');info.innerHTML='';
 const z=probleme.filter(x=>!ort||x.ortsteil===ort),sel=z.find(x=>x.id===wahl),lin=[];
 z.filter(x=>x.art!=='keine'&&(alle||x===sel)).forEach(x=>x.linien.forEach(l=>{lin.push(l);
  L.polyline(l,{pane:'band',color:GELB,weight:14,opacity:.65,lineCap:'round',lineJoin:'round'}).addTo(band);}));
 if(sel){
  const w=(c)=>wer(c,sel.baulast);
  info.innerHTML=`<div class="t">${sel.strasse}${sel.zusatz?' – '+sel.zusatz:''}</div><div class="s">${sel.ortsteil}</div>
   <p>Laut Satzung: ${sel.art==='luecke'?sel.baulast:'Baulast '+sel.baulast}, Reinigung ${w(sel.reinigung)}, Winterdienst ${w(sel.winterdienst)}</p>
   <p>${{unsicher:'Die Zuordnung auf der Karte ist unsicher (gelb hinterlegt).',luecke:'Im Straßenverzeichnis ist keine gültige Baulast angegeben (gelb hinterlegt).',keine:'Lässt sich auf der Karte nicht verorten.'}[sel.art]}</p>
   ${sel.grund?`<p><small>${sel.grund}</small></p>`:''}`;
  if(sel.art==='keine'&&sel.mitte){L.circleMarker(sel.mitte,{radius:16,color:'#b38f00',weight:3,dashArray:'4 4',fill:false}).addTo(band);
   if(zoom)m.setView(sel.mitte,15);}
  else if(zoom&&lin.length)m.fitBounds(L.featureGroup(lin.map(l=>L.polyline(l))).getBounds().pad(.6));}
 legende();}

const leg=L.control({position:'bottomright'});leg.onAdd=()=>L.DomUtil.create('div','box');leg.addTo(m);
function legende(){
 const sw=(c,t)=>`<div><i style="background:${c===ANL?`repeating-linear-gradient(90deg,${c} 0 6px,transparent 6px 10px)`:c}"></i>${t}</div>`;
 leg.getContainer().innerHTML=`<b>${ANSICHTEN[ansicht].t}</b>`+ANSICHTEN[ansicht].leg.map(([c,t])=>sw(c,t)).join('')+sw(GRAU,'nicht im Verzeichnis')+
  (band.getLayers().length?`<div style="margin-top:4px"><i style="height:10px;background:${GELB};opacity:.8"></i>Problemfall</div>`:'');}
legende();
</script></body></html>
