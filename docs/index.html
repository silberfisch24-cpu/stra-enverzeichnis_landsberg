<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straßenverzeichnis Landsberg – Baulast</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#k{height:100%;margin:0}.leg{background:#fff;padding:8px 10px;border-radius:6px;font:13px/1.5 system-ui;box-shadow:0 1px 4px #0005}
.leg i{display:inline-block;width:22px;height:4px;margin-right:6px;vertical-align:middle}#s{position:absolute;z-index:1000;top:10px;left:50px;padding:6px;font:14px system-ui;width:220px}</style></head>
<body><input id="s" placeholder="Straße suchen …" list="l"><datalist id="l"></datalist><div id="k"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const m=L.map('k').setView([51.45,12.2],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(m);
const ebenen={};
fetch('strassen.geojson').then(r=>r.json()).then(d=>{
 const g=L.geoJSON(d,{style:f=>({color:f.properties.stroke,weight:f.properties['stroke-width'],opacity:f.properties['stroke-opacity']}),
  onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(`<b>${p.name}</b><br>${p.ortsteil}<br>Baulast: ${p.baulast}${p.hinweis?'<br>'+p.hinweis:''}`);
   (ebenen[p.name]=ebenen[p.name]||[]).push(l);}}).addTo(m);
 m.fitBounds(g.getBounds());
 document.getElementById('l').innerHTML=Object.keys(ebenen).sort().map(n=>`<option>${n}`).join('');
 document.getElementById('s').onchange=e=>{const a=ebenen[e.target.value];if(a){m.fitBounds(L.featureGroup(a).getBounds().pad(.3));a[0].openPopup();}};
});
const leg=L.control({position:'bottomright'});leg.onAdd=()=>{const d=L.DomUtil.create('div','leg');
d.innerHTML=[['#1f77d4','Stadt'],['#f08a00','Kreis'],['#d62728','Privat'],['#2ca02c','Land'],['#8e44ad','gemischt'],['#9e9e9e','nicht im Verzeichnis']].map(([c,t])=>`<div><i style="background:${c}"></i>${t}</div>`).join('');return d;};leg.addTo(m);
</script></body></html>
