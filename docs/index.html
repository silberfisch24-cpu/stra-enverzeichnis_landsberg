<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straßenverzeichnis Landsberg – Zuständigkeiten</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#k{height:100%;margin:0}
.box{background:#fff;padding:8px 10px;border-radius:6px;font:13px/1.5 system-ui;box-shadow:0 1px 4px #0005}
.box i{display:inline-block;width:22px;height:4px;margin-right:6px;vertical-align:middle}
.box label{display:block;cursor:pointer}.box select{width:100%;margin:4px 0;font:13px system-ui}
#s{position:absolute;z-index:1000;top:10px;left:50px;padding:6px;font:14px system-ui;width:200px}
</style></head>
<body><input id="s" placeholder="Straße suchen …" list="l"><datalist id="l"></datalist><div id="k"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BAU={'Stadt':'#1f77d4','Kreis':'#f08a00','Privat':'#d62728','Land':'#2ca02c','gemischt (Text beachten)':'#8e44ad'};
const GRAU='#9e9e9e', ANL='#d81b9a';
const Z={A:'Anlieger',B:'Baulastträger'};
const ANSICHTEN={
 baulast:{t:'Baulast (wer unterhält die Straße)',leg:[['#1f77d4','Stadt'],['#f08a00','Kreis'],['#d62728','Privat'],['#2ca02c','Land'],['#8e44ad','gemischt']],
  farbe:p=>BAU[p.baulast]},
 reinigung:{t:'Straßenreinigung Fahrbahn: wer kehrt',leg:[[ANL,'Anlieger (gestrichelt)'],['#1f77d4','Stadt'],['#f08a00','Kreis'],['#d62728','Privat'],['#2ca02c','Land'],['#8e44ad','Baulastträger, gemischt']],
  farbe:p=>p.reinigung==='A'?ANL:p.reinigung==='B'?BAU[p.baulast]:null},
 winter:{t:'Winterdienst Fahrbahn: wer räumt',leg:[[ANL,'Anlieger (gestrichelt)'],['#1f77d4','Stadt'],['#f08a00','Kreis'],['#d62728','Privat'],['#2ca02c','Land'],['#8e44ad','Baulastträger, gemischt']],
  farbe:p=>p.winterdienst==='A'?ANL:p.winterdienst==='B'?BAU[p.baulast]:null},
 pflicht:{t:'Anlieger-Pflichten (Reinigung + Winterdienst)',leg:[[ANL,'beides Anlieger (gestrichelt)'],['#34495e','beides Baulastträger'],['#00a8c6','unterschiedlich']],
  farbe:p=>!p.reinigung?null:(p.reinigung==='A'&&p.winterdienst==='A')?ANL:(p.reinigung==='B'&&p.winterdienst==='B')?'#34495e':'#00a8c6'}
};
let ansicht='baulast', zeigeGrau=true, ort='';
const m=L.map('k').setView([51.45,12.2],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(m);
m.createPane('halo');m.getPane('halo').style.zIndex=395;m.getPane('halo').style.pointerEvents='none';
const ebenen={},nachId={};let g,zdaten=[],halo=L.layerGroup().addTo(m),zwahl='off';
function stil(f){const p=f.properties,c=ANSICHTEN[ansicht].farbe(p);
 const aus=(ort&&p.ortsteil!==ort)||(!c&&!zeigeGrau);
 return {color:c||GRAU,weight:c?4:2,opacity:aus?0:(c?0.9:0.5),interactive:!aus,dashArray:c===ANL?'9 7':null};}
function popup(p){const z=(a,w)=>w?`${a}: ${Z[w]}`:'';
 return `<b>${p.name}</b><br>${p.ortsteil}`+(p.baulast!=='nicht im Verzeichnis'?
  `<br>Baulast: ${p.baulast}<br>${z('Reinigung Fahrbahn',p.reinigung)}<br>${z('Winterdienst Fahrbahn',p.winterdienst)}<br>${z('Gehweg',p.gehweg)}`+
  (p.art?`<br>Straßenart: ${p.art}`:'')+(p.hinweis?`<br><i>${p.hinweis}</i>`:'')+
  (p.osm_status.startsWith('Alias (')?'<br><i>Name wahrscheinlich gleich (nicht bestätigt)</i>':''):'<br><i>nicht im Verzeichnis</i>');}
fetch('strassen.geojson').then(r=>r.json()).then(d=>{
 g=L.geoJSON(d,{style:stil,onEachFeature:(f,l)=>{nachId[f.properties.osm_id]=l;l.bindPopup(popup(f.properties));(ebenen[f.properties.name]=ebenen[f.properties.name]||[]).push(l);}}).addTo(m);
 m.fitBounds(g.getBounds());
 document.getElementById('l').innerHTML=Object.keys(ebenen).sort().map(n=>`<option>${n}`).join('');
 document.getElementById('s').onchange=e=>{const a=ebenen[e.target.value];if(a){m.fitBounds(L.featureGroup(a).getBounds().pad(.3));a[0].openPopup();}};
 const orte=[...new Set(d.features.map(f=>f.properties.ortsteil))].sort();
 ctl.getContainer().querySelector('#o').innerHTML='<option value="">alle Ortsteile</option>'+orte.map(o=>`<option>${o}`).join('');
});
const ctl=L.control({position:'topright'});
ctl.onAdd=()=>{const d=L.DomUtil.create('div','box');L.DomEvent.disableClickPropagation(d);
 d.innerHTML=`<b>Ansicht</b><select id="a">${Object.entries(ANSICHTEN).map(([k,v])=>`<option value="${k}">${v.t}`).join('')}</select>
 <select id="o"><option value="">alle Ortsteile</option></select>
 <label><input type="checkbox" id="gr" checked> Straßen ohne Verzeichniseintrag (grau)</label>
 <hr style="margin:6px 0"><b>Geteilte Straßen</b>
 <select id="z"><option value="off">Deaktiviert</option><option value="all">Alle</option></select><div id="zi" style="max-width:300px"></div>`;
 d.querySelector('#z').onchange=e=>{zwahl=e.target.value;zeige(true);};
 d.querySelector('#a').onchange=e=>{ansicht=e.target.value;aktual();};
 d.querySelector('#o').onchange=e=>{ort=e.target.value;aktual();zliste();if(ort&&g){const b=L.featureGroup(g.getLayers().filter(l=>l.feature.properties.ortsteil===ort)).getBounds();if(b.isValid())m.fitBounds(b.pad(.1));}};
 d.querySelector('#gr').onchange=e=>{zeigeGrau=e.target.checked;aktual();};return d;};
ctl.addTo(m);
fetch('zusatz.json').then(r=>r.json()).then(z=>{zdaten=z;zliste();});
// Auswahlliste der Teilbereiche; folgt dem Ortsteil-Filter
function zliste(){const sel=ctl.getContainer().querySelector('#z');const z=zdaten.filter(x=>!ort||x.ortsteil===ort);
 while(sel.options.length>2)sel.remove(2);sel.querySelector('optgroup')?.remove();
 sel.options[1].text=`Alle (${z.length})`;
 const og=document.createElement('optgroup');og.label='Teilbereiche (● zugeordnet, ○ Zuordnung offen)';
 z.slice().sort((a,b)=>(a.ortsteil+a.strasse+a.zusatz).localeCompare(b.ortsteil+b.strasse+b.zusatz,'de')).forEach(x=>{
  const o=document.createElement('option');o.value=x.id;o.text=`${x.wege.length?'●':'○'} ${ort?'':x.ortsteil+': '}${x.strasse} (${x.zusatz})`;og.appendChild(o);});
 sel.appendChild(og);
 if(zwahl!=='off'&&zwahl!=='all'&&!z.some(x=>String(x.id)===zwahl))zwahl='off';
 sel.value=zwahl;zeige(false);}
function linien(ids){return ids.map(i=>nachId[i]).filter(Boolean);}
function zeige(zoom){halo.clearLayers();const info=ctl.getContainer().querySelector('#zi');info.innerHTML='';
 const wahl=zwahl==='off'?[]:zwahl==='all'?zdaten.filter(x=>!ort||x.ortsteil===ort):zdaten.filter(x=>String(x.id)===zwahl);
 let alle=[];
 wahl.forEach(x=>{const offen=!x.wege.length;
  linien(offen?x.strassenwege:x.wege).forEach(l=>{alle.push(l);
   L.polyline(l.getLatLngs(),{pane:'halo',color:'#111',weight:offen?7:8,opacity:offen?0.5:0.65,dashArray:offen?'5 5':null,lineCap:'butt',lineJoin:'round'}).addTo(halo);});});
 if(zwahl!=='off'&&zwahl!=='all'&&wahl[0]){const x=wahl[0];
  info.innerHTML=`<br><b>${x.strasse} (${x.zusatz})</b><br>Baulast: ${x.baulast}, Reinigung: ${x.reinigung}, Winterdienst: ${x.winterdienst}<br>Rest der Straße: ${x.haupteintrag}`+
   (x.wege.length?`<br><i>${x.wege.length} Weg(e) zugeordnet</i>`:`<br><i>Zuordnung offen – ganze Straße gestrichelt markiert. ${x.notiz}</i>`);
  if(zoom&&alle.length)m.fitBounds(L.featureGroup(alle).getBounds().pad(.4));}
 legende();}
const leg=L.control({position:'bottomright'});leg.onAdd=()=>L.DomUtil.create('div','box');leg.addTo(m);
function aktual(){if(g)g.setStyle(stil);legende();}
function legende(){
 leg.getContainer().innerHTML=`<b>${ANSICHTEN[ansicht].t}</b>`+ANSICHTEN[ansicht].leg.map(([c,t])=>`<div><i style="background:${c===ANL?`repeating-linear-gradient(90deg,${c} 0 6px,transparent 6px 10px)`:c}"></i>${t}</div>`).join('')+`<div><i style="background:${GRAU}"></i>nicht im Verzeichnis</div>`+
 (zwahl!=='off'?`<div style="margin-top:4px"><i style="background:#111;height:6px;opacity:.7"></i>Teilbereich (Zuständigkeit weicht ab)</div><div><i style="height:6px;background:repeating-linear-gradient(90deg,#111 0 5px,transparent 5px 10px);opacity:.6"></i>Zuordnung offen (ganze Straße)</div>`:'');}
aktual();
fetch('offene.json').then(r=>r.json()).then(o=>{if(!o.length)return;const c=L.control({position:'bottomleft'});c.onAdd=()=>{const d=L.DomUtil.create('div','box');
 d.innerHTML='<b>Im Verzeichnis, nicht in OSM</b><br>'+o.map(x=>`${x.strasse} (${x.ortsteil}, ${x.baulast}) – ${x.osm_status}`).join('<br>');return d;};c.addTo(m);});
</script></body></html>
